name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -alias metrolist \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass metrolist123 \
            -keypass metrolist123 \
            -dname "CN=Metrolist, OU=App, O=App, L=Cairo, S=Cairo, C=EG"

      - name: Build Release APK
        run: ./gradlew --console=plain assembleFossRelease --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: Metrolist
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Sign APK
        run: |
          UNSIGNED=$(find app/build/outputs/apk/foss/release -name "*unsigned*.apk" | head -1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -r | head -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -1)
          $ZIPALIGN -v -f 4 "$UNSIGNED" app/build/outputs/apk/foss/release/aligned.apk
          $APKSIGNER sign \
            --ks keystore.jks \
            --ks-pass pass:metrolist123 \
            --key-pass pass:metrolist123 \
            --ks-key-alias metrolist \
            --out app/build/outputs/apk/foss/release/Metrolist.apk \
            app/build/outputs/apk/foss/release/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist
          path: app/build/outputs/apk/foss/release/Metrolist.apk
